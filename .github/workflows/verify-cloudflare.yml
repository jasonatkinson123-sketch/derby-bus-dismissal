name: Verify independent Cloudflare build
on:
  push:
    branches: [feature/independent-cloudflare-pin]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: test -f dist/server/wrangler.json
      - run: pnpm exec tsc --noEmit
